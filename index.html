 if(fast){pos.x+=Math.sin(t*2.1)*.13*beat;pos.y+=Math.cos(t*3)*.08*beat}camera.position.lerp(pos,1-Math.exp(-dt*2.4));camera.lookAt(target);

 const isGarage=ch.id==='v2';garage.visible=isGarage;garage.position.z=-14+Math.sin(elapsed*.32)*1.5;garage.position.x=7.2-smooth(61,68,t)*2.0;garage.rotation.y=-.12;

 let flight=(t%7)/7;let showStone=ch.id==='v1'||ch.id==='pre2'||fast;stone.visible=showStone;trail.visible=showStone;let f=flight*33;let idx=Math.min(32,Math.floor(f));let mix=f-idx;let pa=trailPts[idx],pb=trailPts[idx+1]||pa;stone.position.lerpVectors(pa,pb,mix);stone.rotation.set(t*2,t*3,t*2);

function fmt(s){return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`}
function draw(){let t=audio.currentTime||0;let dt=Math.min(.05,(performance.now()-playStart)/1000);playStart=performance.now();if(analyser&& !audio.paused){analyser.getByteFrequencyData(dataArray);let sum=0;for(let i=1;i<18;i++)sum+=dataArray[i];level=THREE.MathUtils.lerp(level,sum/(17*255),.23)}else level*=.93;updateScene(t,dt);renderer.render(scene,camera);const ratio=Math.min(1,t/DURATION);$('#fill').style.width=(ratio*100)+'%';$('#knob').style.left=(ratio*100)+'%';$('#now').textContent=fmt(t);$('#total').textContent=fmt(DURATION);$('#seek').setAttribute('aria-valuenow',t.toFixed(1));requestAnimationFrame(draw)}

function setupAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Web Audio API unavailable');audioCtx=new AC();analyser=audioCtx.createAnalyser();analyser.fftSize=256;dataArray=new Uint8Array(analyser.frequencyBinCount);const src=audioCtx.createMediaElementSource(audio);src.connect(analyser);analyser.connect(audioCtx.destination);const recordingAudio=audioCtx.createMediaStreamDestination();analyser.connect(recordingAudio);audio._recordingAudio=recordingAudio}return audioCtx}
$('#play').onclick=async()=>{if(audio.paused){try{try{const ctx=setupAudio();if(ctx.state==='suspended')await ctx.resume()}catch(graphError){console.warn('Audio analysis unavailable; playing the source directly.',graphError)}await audio.play();$('#play').textContent='Ⅱ';$('#play').setAttribute('aria-label','一時停止');$('#audioState').textContent='ORIGINAL TRACK · PLAYING'}catch(e){$('#audioState').textContent='再生できません · 音源を再リンクしてください';$('#fileHint').textContent='音源を再リンク ↗';$('#fileHint').style.pointerEvents='auto';$('#fileHint').style.opacity='1';$('#fileHint').style.cursor='pointer'}}else{audio.pause();$('#play').textContent='▶';$('#play').setAttribute('aria-label','再生');$('#audioState').textContent='PAUSED · PREVIZ READY'}};
audio.addEventListener('ended',()=>{$('#play').textContent='▶';if(mediaRecorder?.state==='recording')mediaRecorder.stop();else $('#audioState').textContent='PLAYBACK COMPLETE'});audio.addEventListener('canplay',()=>{$('#audioState').textContent='ORIGINAL TRACK · READY';$('#loading').classList.add('hidden')});audio.addEventListener('error',()=>{$('#audioState').textContent='音源を開けません · 再リンクしてください';$('#loading').classList.add('hidden');$('#fileHint').textContent='音源を再リンク ↗';$('#fileHint').style.pointerEvents='auto';$('#fileHint').style.opacity='1';$('#fileHint').style.cursor='pointer'});

let mediaRecorder,recorded=[];$('#record').onclick=async()=>{const b=$('#record');if(mediaRecorder?.state==='recording'){mediaRecorder.stop();b.textContent='●';b.title='フル尺をWebMで録画';return}try{const ctx=setupAudio();if(ctx.state==='suspended')await ctx.resume();const stream=canvas.captureStream(30);audio._recordingAudio.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const type=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));mediaRecorder=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:8000000}:undefined);recorded=[];mediaRecorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recorded,{type:mediaRecorder.mimeType||'video/webm'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='piyon-toishi-previz.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('#audioState').textContent='WEBMを書き出しました'};audio.currentTime=0;mediaRecorder.start(1000);await audio.play();$('#play').textContent='Ⅱ';b.textContent='■';b.title='録画を停止して保存';$('#audioState').textContent='REC · 曲全体をリアルタイム録画中'}catch(e){$('#audioState').textContent='WebM録画に対応したブラウザで開いてください'}};
const seek=$('#seek');function setSeek(e){const r=seek.getBoundingClientRect();audio.currentTime=THREE.MathUtils.clamp((e.clientX-r.left)/r.width,0,1)*DURATION}seek.addEventListener('pointerdown',e=>{seek.setPointerCapture(e.pointerId);setSeek(e)});seek.addEventListener('pointermove',e=>{if(e.buttons)setSeek(e)});seek.addEventListener('keydown',e=>{if(e.key==='ArrowRight')audio.currentTime=Math.min(DURATION,audio.currentTime+5);if(e.key==='ArrowLeft')audio.currentTime=Math.max(0,audio.currentTime-5);if(e.key==='Home')audio.currentTime=0;if(e.key==='End')audio.currentTime=DURATION});$('#volume').oninput=e=>audio.volume=Number(e.target.value);audio.volume=.82;$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('#app').requestFullscreen?.();
